version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Hold TypeScript below 7 until typescript-eslint supports it; remove when that lands.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-packages-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
  # Keep the content submodule fresh (the content-sync workflow also PRs bumps)
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
