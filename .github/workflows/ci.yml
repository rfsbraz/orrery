name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip release-please's own PRs, and skip a draft PR (still WIP - the
    # ready_for_review type above means the real run fires when it opens for
    # review, no extra push needed to wake it).
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # orrery-content is needed for SSG
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Add the spoiler fixture wing
        # A made-up wing whose curator notes name fake spoilers. It has to be
        # in the content folder at build time, because wing routes only exist
        # for wings the build saw. CI only: the Docker image never has it.
        run: node scripts/spoiler-check.mjs --install
      - name: Build
        run: npm run build
      - name: Spoiler payload check
        # Curator notes must not ship in the prerendered HTML or RSC payload
        # (orrery#106). Reads the build output for the fixture wing.
        run: node scripts/spoiler-check.mjs

      - name: Render check
        # Boots the built app and asks every page whether it actually renders:
        # status, our own committed assets resolving, and the right lang on the
        # right locale. This was run by hand, which meant it was run when
        # someone remembered, and it is how a wing shipped with 5 of 32 images
        # and every Portuguese page declaring itself English.
        #
        # Third-party covers (openlibrary, wikimedia) are reported but never
        # fatal: their servers must not be able to block our merges.
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          PORT=3311 node .next/standalone/server.js &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3311/ > /dev/null && break
            sleep 2
          done
          node scripts/render-check.mjs --base http://localhost:3311 | tee /tmp/render.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### Render check"
            echo '```'
            tail -25 /tmp/render.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
