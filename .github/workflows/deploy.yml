name: Deploy

# The last step of the canon pipeline, and the one that used to be an SSH.
#
# Content merges dispatch a submodule bump, `auto-merge-content` merges it once
# green, `docker` publishes :edge, and this rolls the container on homeberry.
# Nothing here waits for a person.
#
# It runs on a self-hosted runner ON homeberry rather than pulling the image
# from a cloud runner, because the machine that needs the new image is the one
# doing the work. Push-based, so a merge is live in the time it takes to pull,
# with no polling interval to wait out.
#
# Safe on a private repo. GitHub warns against self-hosted runners on PUBLIC
# repos because a fork's pull request could run arbitrary code on the machine;
# this repo is private, so only trusted contributors can trigger a workflow.
on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Two merges in quick succession should end on the newest
# image, not race each other recreating the same container.
concurrency:
  group: deploy-orrery
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homeberry]
    timeout-minutes: 15
    steps:
      # No checkout. This job touches the deployed stack, not this repo's
      # source, and checking out would only add a clone to every deploy.
      - name: Pull and roll the container
        working-directory: /home/rfsbraz/TheOneStack
        run: |
          set -euo pipefail
          docker compose pull orrery
          docker compose up -d orrery

      - name: Wait for the healthcheck to pass
        run: |
          set -euo pipefail
          # The compose healthcheck is the app answering on :3000, so this is a
          # real readiness signal rather than "the container exists". Anything
          # other than healthy inside two minutes is a failed deploy.
          for _ in $(seq 1 24); do
            state=$(docker inspect orrery --format '{{.State.Health.Status}}')
            [ "$state" = "healthy" ] && echo "healthy" && exit 0
            [ "$state" = "unhealthy" ] && break
            sleep 5
          done
          echo "::error title=Deploy unhealthy::orrery did not become healthy within 2 minutes"
          docker logs --tail 40 orrery
          exit 1

      - name: Verify the running revision is the one we just built
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          running=$(docker inspect orrery \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          echo "running revision: ${running}"
          # Deploying and *believing* you deployed are different things: the
          # running revision was two merges behind for a day while every
          # workflow showed green. This asserts the container actually carries
          # the commit that triggered it.
          if [ -n "${EXPECTED}" ] && [ "${running}" != "${EXPECTED}" ]; then
            echo "::error title=Wrong revision deployed::expected ${EXPECTED}, running ${running}. The image may not have finished publishing."
            exit 1
          fi
          echo "orrery is live on ${running:0:8}" >> "$GITHUB_STEP_SUMMARY"

      - name: Reclaim space from superseded images
        if: always()
        run: docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/rfsbraz/orrery"
