name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * 1" # weekly edge rebuild
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR needs no extra secrets (built-in GITHUB_TOKEN). To also publish to
  # Docker Hub, add DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets + a login/tags step.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # PRs: build (amd64) + smoke test only, no push
      - name: Build (PR smoke)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          load: true
          tags: orrery:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --rm -p 3000:3000 --name orrery orrery:pr
          ok=""
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:3000/ | grep -q "Orrery"; then ok=1; break; fi
            sleep 2
          done
          docker logs orrery || true
          docker stop orrery || true
          [ "$ok" = "1" ] || { echo "smoke test failed"; exit 1; }

      # Non-PR: multi-arch build + push to GHCR
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: homeberry (the deploy target) is x86_64, and the
          # emulated arm64 leg crashes under QEMU during Next's static page
          # generation ("uncaught target signal 4 (Illegal instruction)").
          # Restore arm64 via a native ARM runner if a target ever needs it.
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tell the private ops repo to deploy. The deploy itself cannot live here:
  # it needs a self-hosted runner on homeberry, and GitHub is explicit that
  # self-hosted runners must not be used with public repositories, since a
  # pull request from anyone could then run code on that machine. This repo is
  # public, so all it does is announce that an image exists.
  notify-deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to the deploy repo
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=Not deployed::DEPLOY_DISPATCH_TOKEN is not set, so the new image was published but nothing was told to roll it. Add a fine-grained PAT scoped to rfsbraz/TheOneStack (Contents: read and write) as DEPLOY_DISPATCH_TOKEN."
            exit 0
          fi
          gh api repos/rfsbraz/TheOneStack/dispatches             --method POST             --raw-field event_type=orrery-published             --raw-field "client_payload[sha]=${SHA}"
          echo "Asked TheOneStack to deploy ${SHA:0:8}." >> "$GITHUB_STEP_SUMMARY"
