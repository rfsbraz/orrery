name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * 1" # weekly edge rebuild
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR needs no extra secrets (built-in GITHUB_TOKEN). To also publish to
  # Docker Hub, add DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets + a login/tags step.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # PRs: build (amd64) + smoke test only, no push
      - name: Build (PR smoke)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            REVISION=${{ github.sha }}
          load: true
          tags: orrery:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --rm -p 3000:3000 --name orrery orrery:pr
          ok=""
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:3000/ | grep -q "Orrery"; then ok=1; break; fi
            sleep 2
          done
          docker logs orrery || true
          docker stop orrery || true
          [ "$ok" = "1" ] || { echo "smoke test failed"; exit 1; }

      # Non-PR: multi-arch build + push to GHCR
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: homeberry (the deploy target) is x86_64, and the
          # emulated arm64 leg crashes under QEMU during Next's static page
          # generation ("uncaught target signal 4 (Illegal instruction)").
          # Restore arm64 via a native ARM runner if a target ever needs it.
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
